# Security vulnerabilities go through SECURITY.md, never through this form.
name: Bug report
description: A thread was marked done when it shouldn't have been, was kept when it should have been done, or the command failed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search the open and closed issues first: the bug may already be reported or fixed.

        Found a security vulnerability? Don't file it here. Follow `SECURITY.md` to report it privately.

        Never paste a token. Output from `gh notif-clean` includes repository names, thread titles, and logins: remove anything private before you paste it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including the exact error message if there was one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead. For a wrongly marked or kept thread, say who took part in it.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      description: Include `GH_NOTIF_CLEAN_IGNORE` if it is set, for example `GH_NOTIF_CLEAN_IGNORE='cla-assistant[bot]' gh notif-clean -n`.
      placeholder: gh notif-clean --dry-run -v --ignore 'cla-assistant[bot]'
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The `--dry-run -v` output for the affected thread, or the full error. Remove private repository names and titles first.
      render: text
  - type: input
    id: thread
    attributes:
      label: Thread link
      description: Link to the affected PR or issue, if it's public.
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Paste what these show. In `gh extension list`, a binary install shows its release tag; anything else runs from source with Node.
      value: |
        gh --version:
        The notif-clean line of gh extension list:
        node --version (only if that line shows no release tag):
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Windows (WSL)
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: I searched the open and closed issues for this bug.
          required: true
        - label: This issue holds no token and nothing private.
          required: true
