name: Feature request
description: Suggest a new flag, behavior, or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search the open and closed issues first: it may already be planned or decided.

        Want a bot ignored by default? Use the **Suggest a default bot** form instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do with your notifications, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd like it to work, for example the flag and an example command.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve it, including existing flags or a `gh alias`, and why they fall short.
