# Dependabot version updates. Security updates are switched on in the repository settings and open
# whenever an advisory lands, outside this schedule, but take the commit format and labels set here.
# Docs: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  # Dev dependencies only (typescript, @types/node): the extension has no runtime dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 2
    # build(deps-dev): ..., the repository's type(scope) commit format.
    commit-message:
      prefix: build
      include: scope
    # Defining any label stops Dependabot creating its default `dependencies` label.
    labels:
      - "area: ci"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 2
    # ci(deps): ...
    commit-message:
      prefix: ci
      include: scope
    labels:
      - "area: ci"
